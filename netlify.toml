# Netlify deploy config for HOMADE SELANGOR
# Continuous deploy: connect this repo in Netlify → every push auto-builds.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Astro's sitemap integration emits sitemap-index.xml, but crawlers & humans
# often look for /sitemap.xml. Serve the index at that conventional path too
# (200 rewrite, not a redirect, so the XML is returned directly).
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 200

# Long-cache the fingerprinted/static assets. HTML stays revalidated by default.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
